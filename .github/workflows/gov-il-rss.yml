name: Gov.il RSS to Telegram

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:  # Manual trigger

jobs:
  check-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8

      - name: Restore state cache
        uses: actions/cache/restore@v5
        with:
          path: |
            sent_guids.txt
            feed_failures.json
          key: gov-il-rss-${{ github.run_id }}
          restore-keys: gov-il-rss-

      - name: Check RSS and send new items
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RSS_URLS: ${{ secrets.RSS_URLS }}
        run: uv run --no-project --with curl_cffi python gov_il_rss.py

      # The bundled cache action skips its post-step save when the job fails,
      # which would lose state exactly on error runs; save explicitly instead.
      - name: Save state cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            sent_guids.txt
            feed_failures.json
          key: gov-il-rss-${{ github.run_id }}
